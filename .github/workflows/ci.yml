name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        run: pytest tests -q
        env:
          RESEARCHOPS_LLM_PROVIDER: mock

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: apps/web
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [python]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t researchops-api .
      # web image build runs in the `web` job implicitly; building the API
      # image here validates the production packaging path.

  # Manual, needs real LLM keys: full benchmark + regression gate.
  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Run ResearchOpsBench (mock smoke mode)
        run: |
          python -m researchops.evals.benchmark --limit 6 --out results/current.json
          cat results/current.json | python -c "import json,sys; print(json.dumps(json.load(sys.stdin)['summary'], indent=2))"
      - name: Regression gate (when baseline exists)
        run: |
          if [ -f results/baseline.json ]; then
            python -m researchops.evals.regression results/current.json --baseline results/baseline.json
          else
            echo "no baseline yet; current results would become it"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results/
